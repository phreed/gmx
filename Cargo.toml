[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Fredrick Eisele <fred.eisele@vanderbilt.edu>"]
repository = "https://github.com/phreed/gmx"
publish = false

[workspace.dependencies]
gmx-proto = { path = "crates/gmx-proto" }
gmx-model = { path = "crates/gmx-model" }
gmx-net = { path = "crates/gmx-net" }
gmx-widgets = { path = "crates/gmx-widgets" }
gmx-widget-pkg = { path = "crates/gmx-widget-pkg" }
gmx-testkit = { path = "crates/gmx-testkit" }

bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
indexmap = "2.14"
proptest = "1.11"
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "net", "io-util", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
